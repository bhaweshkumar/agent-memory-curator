[project]
name = "agent-memory-curator"
version = "0.1.0"
description = "CLI coding-assistant agent that curates memory context via a Decider-style relevance scorer before calling Amazon Bedrock."
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "boto3>=1.34.0",
]

[project.scripts]
memory-curator = "cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
